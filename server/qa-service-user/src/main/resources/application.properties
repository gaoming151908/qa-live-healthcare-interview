spring.application.name=qa-service-user
server.port=${SERVER_PORT:8080}

# ---------- MySQL (docker-compose.yml) ----------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:doctor_db}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
spring.datasource.username=${DB_USER:qa_user}
spring.datasource.password=${DB_PASSWORD:Qa@123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# The schema is owned by docker/mysql/init/01-schema.sql; Hibernate must never alter it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jackson.time-zone=Asia/Shanghai

# ---------- Patient login JWT ----------
# Override JWT_SECRET in any non-local environment. Must be at least 32 bytes.
app.jwt.secret=${JWT_SECRET:qa-live-healthcare-interview-jwt-secret-2025}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------- CORS ----------
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=false
spring.web.cors.max-age=3600

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoints.web.base-path=/actuator
management.info.env.enabled=true
info.app.name=qa-service-user
info.app.description=QA Service User - Healthcare QA System User Management Service
info.app.version=0.0.1-SNAPSHOT
info.app.encoding=UTF-8
info.app.java.version=17
