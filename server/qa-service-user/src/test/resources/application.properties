# Tests run against an in-memory H2 database in MySQL compatibility mode,
# so `mvn test` never depends on a running Docker/MySQL instance.
spring.datasource.url=jdbc:h2:mem:qa_user_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
app.jwt.secret=qa-live-healthcare-interview-test-secret-key-2025
app.jwt.expiration-ms=3600000
